<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b12">
<title>FRAME — Prompt Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#121622;--panel2:#191f2d;--line:#262e40;--muted:#8993a8;--text:#f5f7fb;--gold:#e9c46a;--violet:#9b8cff;--cyan:#79d7e8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#252443 0,transparent 50%),var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:92px}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
.wrap{max-width:720px;margin:auto;padding:18px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 22px}
.brand{font-size:25px;font-weight:900;letter-spacing:4px}
.brand span{color:var(--gold)}
.balance{border:1px solid #51472c;background:#211e17;border-radius:30px;padding:9px 13px;color:var(--gold);font-weight:800}
.hero{padding:23px;border:1px solid #35314f;border-radius:25px;background:linear-gradient(135deg,#22213b,#151a2b 65%,#172a36);box-shadow:0 18px 50px #0005;position:relative;overflow:hidden}
.hero:after{content:"✦";position:absolute;right:22px;top:12px;font-size:76px;color:#ffffff12}
.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:2px}
.hero h1{font-size:29px;line-height:1.1;margin:12px 0 8px}
.hero p{color:#b8bfd0;line-height:1.5;margin:0;max-width:85%}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 13px}
.section-head h2{font-size:18px;margin:0}
.muted{color:var(--muted);font-size:12px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px 15px;color:white;outline:none;margin:18px 0 4px}
.search:focus{border-color:var(--violet)}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cat{min-height:116px;text-align:left;padding:15px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#171d2a,#10141e);position:relative;overflow:hidden}
.cat:active,.prompt:active{transform:scale(.985)}
.cat .emoji{font-size:25px}
.cat strong{display:block;margin:11px 0 4px;font-size:14px}
.cat small{color:var(--muted)}
.cat.active{border-color:#9b8cff;box-shadow:0 0 0 1px #9b8cff33}
.list{display:grid;gap:10px}
.prompt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:17px;border:1px solid var(--line);background:var(--panel)}
.picon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:#24243a;font-size:20px}
.pinfo{min-width:0;flex:1}
.pinfo b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{display:block;color:var(--muted);margin-top:5px}
.price{font-size:12px;color:var(--gold);font-weight:800;white-space:nowrap}
.free{color:#8ce0b0}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#101522e8,#0b0e17f5);border-top:1px solid #34364d;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:59px;border:1px solid transparent;background:transparent;color:#8d96aa;border-radius:17px;padding:7px 2px 6px;font-size:10px;font-weight:700;letter-spacing:.1px;transition:background .18s,border-color .18s,color .18s,transform .18s}
.nav button:active{transform:scale(.96)}
.nav button .nav-icon{width:29px;height:27px;display:grid;place-items:center;font-size:21px;line-height:1;border-radius:10px;filter:saturate(.8)}
.nav button.active{color:#eeeaff;background:linear-gradient(145deg,#302d50,#1b2032);border-color:#625a91;box-shadow:inset 0 1px 0 #ffffff18,0 5px 18px #0004}
.nav button.active .nav-icon{filter:none;text-shadow:0 0 14px #b9a7ff88}
.nav button[data-page="favorites"].active{color:#eadcff;background:linear-gradient(145deg,#392858,#1b1b32);border-color:#8c69cb;box-shadow:inset 0 1px 0 #ffffff20,0 5px 22px #8d5cff22}
.nav button[data-page="favorites"].active .nav-icon{filter:none}
.nav button[data-page="favorites"].active:after{background:#c7a2ff;box-shadow:0 0 12px #a875ff}
.nav button.active:after{content:"";position:absolute;bottom:3px;width:17px;height:2px;border-radius:4px;background:#c2b4ff;box-shadow:0 0 9px #a99aff}
.nav button:focus-visible{outline:2px solid #b7a8ff;outline-offset:2px}

/* Фиолетовое стеклянное сердце с жидкостью */
.glass-heart{width:27px;height:27px;display:block;overflow:visible;filter:drop-shadow(0 0 5px #a66cff66)}
.glass-heart .liquid{animation:heart-wave 3.4s ease-in-out infinite;transform-origin:center}
.glass-heart .bubble{animation:heart-bubble 2.8s ease-in-out infinite}
.glass-heart .bubble:nth-of-type(2){animation-delay:.8s}
.nav button.active .glass-heart{filter:drop-shadow(0 0 8px #b77cffcc)}
.heart-inline{width:19px;height:19px;vertical-align:-4px;margin-right:5px;filter:drop-shadow(0 0 5px #a66cff66)}
@keyframes heart-wave{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px)}}
@keyframes heart-bubble{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.95;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.glass-heart .liquid,.glass-heart .bubble{animation:none}}
@media(max-width:360px){.nav{gap:4px}.nav button{font-size:9px}}

.page{display:none}
.page.active{display:block}
.back{border:0;background:transparent;color:#c8c1ff;padding:5px 0 15px}
.modal{position:fixed;inset:0;z-index:10;background:#000a;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:25px 25px 0 0;border:1px solid var(--line);background:#121722;padding:22px 18px calc(25px + env(safe-area-inset-bottom))}
.sheet h2{margin:8px 0}
.sheet p{color:#c0c7d6;line-height:1.55}
.action{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(100deg,#b5a4ff,#7f73df);color:#111322;font-weight:900;margin-top:12px}
.secondary{background:#222a39;color:#eef}
.packs{display:grid;gap:10px}
.pack{padding:16px;border:1px solid var(--line);border-radius:15px;background:#1a2030;display:flex;justify-content:space-between;align-items:center}
.profilebox{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);margin:12px 0}
.empty{text-align:center;padding:35px 15px;color:var(--muted)}
.toast{position:fixed;z-index:20;bottom:100px;left:50%;transform:translateX(-50%);background:#242b3b;border:1px solid #46516a;border-radius:12px;padding:11px 16px;display:none;max-width:90%;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>
<div class="wrap">
 <header class="top"><div class="brand">FR<span>A</span>ME</div><button class="balance" onclick="openShop()">✧ <b id="balance">0</b></button></header>
 <main id="home" class="page active">
  <section class="hero"><div class="eyebrow">YOUR CREATIVE SPACE</div><h1>Идеи, которые<br>цепляют.</h1><p>Открывай готовые промпты для историй, загадок и необычных сценариев.</p></section>
  <input id="search" class="search" placeholder="⌕  Найти промпт..." oninput="searchPrompts(this.value)">
  <div class="section-head"><h2>Категории</h2><span class="muted">4 коллекции</span></div>
  <div id="categories" class="categories"></div>
  <div class="section-head"><h2 id="listTitle">Популярные промпты</h2><span class="muted" id="listCount"></span></div>
  <div id="promptList" class="list"></div>
 </main>
 <main id="favorites" class="page"><div class="section-head"><h2>Избранное</h2></div><div id="favoritesList" class="list"></div></main>
 <main id="history" class="page"><div class="section-head"><h2>Мои открытия</h2></div><div id="historyList" class="list"></div></main>
 <main id="profile" class="page"><div class="section-head"><h2>Профиль</h2></div><div class="profilebox"><div class="muted">ВАШ БАЛАНС</div><h1 style="color:var(--gold);margin:8px 0">✧ <span id="profileBalance">0</span></h1><button class="action" onclick="openShop()">Пополнить кристаллы</button></div><div class="profilebox"><div class="muted">АККАУНТ</div><h3 id="userName">Пользователь FRAME</h3><p id="openedCount" class="muted">Открыто промптов: 0</p></div></main>
</div>
<nav class="bottom" aria-label="Основная навигация"><div class="nav">
 <button type="button" class="active" data-page="home" aria-label="Главная" aria-current="page" onclick="showPage('home',this)"><span class="nav-icon" aria-hidden="true">🏠</span><span>Главная</span></button>
 <button type="button" data-page="favorites" aria-label="Избранное" onclick="showPage('favorites',this)"><span class="nav-icon" aria-hidden="true">
<svg class="glass-heart" viewBox="0 0 64 60" role="img" aria-label="Фиолетовое стеклянное сердце">
<defs>
<linearGradient id="navGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#d9c2ff" stop-opacity=".55"/><stop offset="1" stop-color="#8c5bdb" stop-opacity=".9"/></linearGradient>
<linearGradient id="navLiquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8caff"/><stop offset=".48" stop-color="#b36cff"/><stop offset="1" stop-color="#6126bc"/></linearGradient>
<clipPath id="navHeartClip"><path d="M32 55C26 49 4 34 4 19 4 2 24 -2 32 13 40 -2 60 2 60 19 60 34 38 49 32 55Z"/></clipPath>
</defs>
<g clip-path="url(#navHeartClip)">
<rect width="64" height="60" fill="#b98cff" fill-opacity=".16"/>
<path class="liquid" d="M0 29Q10 24 20 29T40 29T64 29V62H0Z" fill="url(#navLiquid)"/>
<path d="M0 29Q10 24 20 29T40 29T64 29" fill="none" stroke="#f4e6ff" stroke-width="1.8" opacity=".9"/>
<circle class="bubble" cx="22" cy="38" r="2.2" fill="#fff"/>
<circle class="bubble" cx="43" cy="43" r="1.5" fill="#fff"/>
</g>
<path d="M32 55C26 49 4 34 4 19 4 2 24 -2 32 13 40 -2 60 2 60 19 60 34 38 49 32 55Z" fill="none" stroke="url(#navGlass)" stroke-width="2.5"/>
<path d="M13 15Q17 7 24 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
</svg>
</span><span>Избранное</span></button>
 <button type="button" data-page="history" aria-label="Открытия" onclick="showPage('history',this)"><span class="nav-icon" aria-hidden="true">📚</span><span>Открытия</span></button>
 <button type="button" data-page="profile" aria-label="Профиль" onclick="showPage('profile',this)"><span class="nav-icon" aria-hidden="true">👤</span><span>Профиль</span></button>
</div></nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><section class="sheet" id="sheet"></section></div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const initData=tg?.initData||"";
const headers={"Content-Type":"application/json","X-Telegram-Init-Data":initData};
const catData=[["Страшные истории","🌑","Тревожные сюжеты и психологический хоррор"],["Представь, если…","🌌","Необычные миры и сценарии будущего"],["Ночные правила","🌙","Инструкции, за которыми скрывается тайна"],["Тайны и загадки","🔐","Расследования и неожиданные разгадки"]];
let allPrompts=[],currentCategory="",me=null;
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...headers,...opts.headers}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Ошибка запроса");return d}
function showPage(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>{x.classList.remove("active");x.removeAttribute("aria-current")});btn?.classList.add("active");btn?.setAttribute("aria-current","page");if(id==="favorites")loadCollection("favorites","favoritesList");if(id==="history")loadCollection("history","historyList")}
function renderCategories(){document.getElementById("categories").innerHTML=catData.map(([n,e,d])=>`<button class="cat ${currentCategory===n?"active":""}" onclick="selectCategory(${JSON.stringify(n)})"><span class="emoji">${e}</span><strong>${n}</strong><small>${d}</small></button>`).join("")}
async function loadPrompts(category="",q=""){try{const u=new URLSearchParams();if(category)u.set("category",category);if(q)u.set("q",q);const d=await api("/api/prompts?"+u);allPrompts=d.prompts;renderList(allPrompts,"promptList");document.getElementById("listCount").textContent=allPrompts.length+" шт."}catch(e){toast(e.message);document.getElementById("promptList").innerHTML='<div class="empty">Откройте FRAME через Telegram, чтобы загрузить магазин.</div>'}}
function renderList(items,target){const el=document.getElementById(target);if(!items.length){el.innerHTML='<div class="empty">Здесь пока ничего нет</div>';return}el.innerHTML=items.map(p=>`<button class="prompt" onclick="openPrompt(${p.id})"><span class="picon">${catData.find(c=>c[0]===p.category)?.[1]||"✧"}</span><span class="pinfo"><b>${escapeHtml(p.title)}</b><small>${escapeHtml(p.category)}</small></span><span class="price ${p.is_free?"free":""}">${p.unlocked?"Открыт":p.is_free?"Бесплатно":"✧ "+p.price}</span></button>`).join("")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function selectCategory(c){currentCategory=currentCategory===c?"":c;renderCategories();document.getElementById("listTitle").textContent=currentCategory||"Популярные промпты";loadPrompts(currentCategory,document.getElementById("search").value)}
function searchPrompts(q){loadPrompts(currentCategory,q)}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
async function openPrompt(id){try{let p=allPrompts.find(x=>x.id===id);if(!p){const d=await api("/api/prompt/"+id);p=d.prompt}if(!p.unlocked){openModal(`<div class="eyebrow">FRAME PROMPT</div><h2>${escapeHtml(p.title)}</h2><p>${escapeHtml(p.description||"Авторский промпт для создания оригинального контента.")}</p><p>Стоимость открытия: <b style="color:var(--gold)">✧ ${p.price} кристалл</b></p><button class="action" onclick="unlockPrompt(${id})">Открыть промпт</button><button class="action secondary" onclick="toggleFavorite(${id})"><svg class="heart-inline" viewBox="0 0 64 60" aria-hidden="true"><defs><linearGradient id="miniGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d9baff"/><stop offset="1" stop-color="#8651d5"/></linearGradient><linearGradient id="miniLiquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8caff"/><stop offset="1" stop-color="#692bc4"/></linearGradient><clipPath id="miniClip"><path d="M32 55C26 49 4 34 4 19 4 2 24 -2 32 13 40 -2 60 2 60 19 60 34 38 49 32 55Z"/></clipPath></defs><g clip-path="url(#miniClip)"><rect width="64" height="60" fill="#c49aff" fill-opacity=".2"/><path d="M0 29Q10 24 20 29T40 29T64 29V62H0Z" fill="url(#miniLiquid)"/></g><path d="M32 55C26 49 4 34 4 19 4 2 24 -2 32 13 40 -2 60 2 60 19 60 34 38 49 32 55Z" fill="none" stroke="url(#miniGlass)" stroke-width="4"/></svg>В избранное</button>`);return}
const d=await api("/api/prompt/"+id);p=d.prompt;openModal(`<div class="eyebrow">${escapeHtml(p.category)}</div><h2>${escapeHtml(p.title)}</h2><p>${escapeHtml(p.full_prompt)}</p><button class="action" onclick="copyPrompt()">Скопировать промпт</button><button class="action secondary" onclick="toggleFavorite(${id})"><svg class="heart-inline" viewBox="0 0 64 60" aria-hidden="true"><defs><linearGradient id="miniGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d9baff"/><stop offset="1" stop-color="#8651d5"/></linearGradient><linearGradient id="miniLiquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8caff"/><stop offset="1" stop-color="#692bc4"/></linearGradient><clipPath id="miniClip"><path d="M32 55C26 49 4 34 4 19 4 2 24 -2 32 13 40 -2 60 2 60 19 60 34 38 49 32 55Z"/></clipPath></defs><g clip-path="url(#miniClip)"><rect width="64" height="60" fill="#c49aff" fill-opacity=".2"/><path d="M0 29Q10 24 20 29T40 29T64 29V62H0Z" fill="url(#miniLiquid)"/></g><path d="M32 55C26 49 4 34 4 19 4 2 24 -2 32 13 40 -2 60 2 60 19 60 34 38 49 32 55Z" fill="none" stroke="url(#miniGlass)" stroke-width="4"/></svg>Избранное</button>`);window.currentPromptText=p.full_prompt;
}catch(e){toast(e.message)}}
async function unlockPrompt(id){try{const d=await api("/api/unlock",{method:"POST",body:JSON.stringify({promptId:id})});closeModal();if(d.crystals!==undefined)updateBalance(d.crystals);toast(d.already?"Уже открыто":"Промпт добавлен в открытия");await loadPrompts(currentCategory);await loadMe();openPrompt(id)}catch(e){closeModal();toast(e.message);if(e.message.includes("кристаллов"))openShop()}}
function copyPrompt(){if(!window.currentPromptText)return;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(window.currentPromptText).then(()=>toast("Скопировано")).catch(()=>toast("Не удалось скопировать"));else toast("Копирование недоступно")}
async function toggleFavorite(id){try{const d=await api("/api/favorites/"+id,{method:"POST"});toast(d.favorite?"Добавлено в избранное":"Удалено из избранного");closeModal();if(document.getElementById("favorites").classList.contains("active"))loadCollection("favorites","favoritesList")}catch(e){toast(e.message)}}
async function loadCollection(endpoint,target){try{const d=await api("/api/"+endpoint);renderList(d.prompts,target)}catch(e){toast(e.message)}}
function openShop(){openModal(`<div class="eyebrow">FRAME WALLET</div><h2>Кристаллы</h2><p>Выбери набор. Оплата проходит через Telegram Stars.</p><div class="packs"><button class="pack" onclick="buyPack('pack10')"><b>✧ 10 кристаллов</b><span>10 ⭐</span></button><button class="pack" onclick="buyPack('pack50')"><b>✧ 50 кристаллов</b><span>45 ⭐</span></button><button class="pack" onclick="buyPack('pack100')"><b>✧ 100 кристаллов</b><span>80 ⭐</span></button></div><button class="action secondary" onclick="closeModal()">Закрыть</button>`)}
async function buyPack(pack){try{const d=await api("/api/stars/invoice",{method:"POST",body:JSON.stringify({pack})});if(!tg?.openInvoice){toast("Откройте магазин внутри Telegram");return}tg.openInvoice(d.url,(status)=>{if(status==="paid"){toast("Оплата получена. Обновляем баланс…");setTimeout(loadMe,1200)}else if(status==="failed")toast("Оплата не прошла");});closeModal()}catch(e){toast(e.message)}}
function updateBalance(n){document.getElementById("balance").textContent=n;document.getElementById("profileBalance").textContent=n}
async function loadMe(){try{const d=await api("/api/me");me=d.user;updateBalance(me.crystals);document.getElementById("userName").textContent=
